<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<title>Right Key — Play by Ear</title>
<style>
:root{--bg:#f5f3f5;--ink:#000;--mut:#6c6c70;--g:rgba(255,255,255,.62);--gb:rgba(255,255,255,.8);--ln:rgba(0,0,0,.08);--c1:#f6cfa8;--c2:#f4c3d6;--c3:#d8cdf5;--c4:#f7efb8;--c5:#cfe3f6;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#000;--ink:#fff;--mut:#98989f;--g:rgba(44,44,46,.55);--gb:rgba(255,255,255,.14);--ln:rgba(255,255,255,.1);--c1:#5a3b2a;--c2:#5a2b44;--c3:#34285c;--c4:#4f4a22;--c5:#1f3a55}}
:root[data-theme="dark"]{--bg:#000;--ink:#fff;--mut:#98989f;--g:rgba(44,44,46,.55);--gb:rgba(255,255,255,.14);--ln:rgba(255,255,255,.1);--c1:#5a3b2a;--c2:#5a2b44;--c3:#34285c;--c4:#4f4a22;--c5:#1f3a55}
*{box-sizing:inherit;-webkit-tap-highlight-color:transparent}
body{margin:0;min-height:100vh;color:var(--ink);font:17px/1.35 -apple-system,BlinkMacSystemFont,"SF Pro Display","Helvetica Neue",Arial,sans-serif;background:var(--bg)}
.atmos{position:fixed;inset:0;z-index:0;overflow:hidden;pointer-events:none}
.atmos i{position:absolute;inset:-35%;filter:blur(48px);will-change:transform}
.atmos i:nth-child(1){background:radial-gradient(40% 35% at 25% 30%,var(--c1),transparent 70%),radial-gradient(35% 30% at 75% 25%,var(--c2),transparent 70%),radial-gradient(40% 35% at 70% 75%,var(--c3),transparent 70%);animation:spin 90s linear infinite}
.atmos i:nth-child(2){background:radial-gradient(35% 30% at 30% 75%,var(--c4),transparent 70%),radial-gradient(30% 28% at 80% 55%,var(--c5),transparent 70%);animation:spin 140s linear infinite reverse}
@keyframes spin{to{transform:rotate(360deg)}}

main{position:relative;z-index:1;max-width:860px;margin:0 auto;padding:18px 16px 40px;display:grid;gap:14px;grid-template-columns:1fr 1fr}
header{grid-column:1/-1;display:flex;justify-content:space-between;align-items:center;gap:10px}
h1{font-size:1.9rem;letter-spacing:-.02em;margin:0}
header a{color:var(--mut);text-decoration:none;font-weight:600;font-size:.95rem}
.card{background:var(--g);-webkit-backdrop-filter:blur(28px) saturate(180%);backdrop-filter:blur(28px) saturate(180%);border:1px solid var(--gb);border-radius:26px;padding:20px;box-shadow:0 8px 30px rgba(0,0,0,.08),inset 0 1px 0 var(--gb)}
.wide{grid-column:1/-1}
.mut{color:var(--mut);font-size:.85rem;font-weight:500;letter-spacing:.02em;text-transform:uppercase}
.sub{color:var(--mut);font-size:.95rem}
.root{font-size:clamp(3rem,14vw,5rem);font-weight:700;letter-spacing:-.05em;line-height:1.1}
.num{font-size:clamp(2.6rem,11vw,4.2rem);font-weight:700;letter-spacing:-.04em;line-height:1.1}
.q{font-size:1.15rem;font-weight:600;margin-top:6px}
.btns{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
button{font:inherit;font-weight:600;font-size:.95rem;color:var(--ink);background:var(--g);-webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px);border:1px solid var(--gb);border-radius:999px;padding:10px 18px;cursor:pointer;transition:transform .15s,background .2s}
button:hover{transform:translateY(-1px);background:var(--gb)}button:active{transform:scale(.96)}

button:disabled{opacity:.45;cursor:default;transform:none}
.bar{height:6px;background:var(--ln);border-radius:3px;overflow:hidden;margin:10px 0 4px}.bar i{display:block;height:100%;width:0;background:var(--ink);transition:width .3s}
.nums{font-size:clamp(1.4rem,5vw,2rem);font-weight:700;letter-spacing:.04em;margin-top:6px;word-break:break-word}
.pulse{animation:pl 1.6s ease-in-out infinite}@keyframes pl{50%{opacity:.45}}
@media(max-width:640px){main{grid-template-columns:1fr}}
.piano{position:relative;display:flex;gap:4px;height:170px;margin-top:12px;padding:12px;border-radius:26px;background:var(--g);-webkit-backdrop-filter:blur(24px) saturate(180%);backdrop-filter:blur(24px) saturate(180%);border:1px solid var(--gb);box-shadow:0 8px 30px rgba(0,0,0,.08);touch-action:manipulation}
.wk,.bk{border:0;padding:0;transition:background .15s}
.wk{flex:1;min-width:0;background:#fff;border-radius:0 0 14px 14px;box-shadow:0 1px 2px rgba(0,0,0,.06);display:flex;align-items:flex-end;justify-content:center;padding-bottom:10px;color:#8e8e93;font-size:.72rem;font-weight:600}
.wk.on{background:#0a84ff;color:#fff}

</style></head><body><div class="atmos"><i></i><i></i></div><main>
<header><h1>🎧 Play by Ear</h1><a href="index.html">← Right Key</a></header>

<section class="card wide">
  <div class="mut">AI listener</div>
  <div class="q" id="status">Loading the neural net…</div>
  <div class="sub" id="sub">Warming up…</div>
  <div class="bar"><i id="loadbar"></i></div>
  <div class="btns">
    <button id="bListen" class="go" disabled>🎤 Listen to a song</button>
    <button id="bSing" disabled>🎙 Sing to me</button>
    <button id="bUpload" disabled>📁 Upload audio</button>
    <input type="file" id="file" accept="audio/*" hidden>
    <button id="bStop" disabled>⏹ Stop</button>
    <button id="bPlay" class="go" disabled>▶ Play it back</button>
    <button id="bLoop" disabled>🔁 Loop: off</button>
    <button id="bReset" disabled>Reset</button>
  </div>
</section>

<section class="card">
  <div class="mut">Key</div>
  <div class="root" id="key">–</div>
  <div class="sub" id="keysub">Listening…</div>
</section>

<section class="card">
  <div class="mut">Now playing</div>
  <div class="num" id="chord">–</div>
  <div class="q" id="learn">Waiting for music…</div>
  <div class="nums" id="prog">–</div>
</section>

<section class="card wide">
  <div class="mut">Melody</div>
  <div class="nums" id="melody">–</div>
  <div id="pi" class="piano"></div>
  <div class="sub" id="plan">Nothing learned yet.</div>
</section>
</main>

<script src="ear-music.js"></script>
<script>
const $ = s => document.querySelector(s);
const EM = window.EarMusic;
const SR = 22050;

let worker = null, modelReady = false;
let actx = null, stream = null, capNode = null, micTimer = null;
let pcm = null, pcmLen = 0, baseSec = 0;
let workerBusy = false;
let jobId = 0;
let allNotes = [], seen = new Set();
let chords = [], learned = null, keyInfo = null, mode = 'song';
let loopOn = false, playTimers = [], playSrc = [];
let lastMelodyMidi = -1;
const pianoEl = {};

// ---------- worker ----------
function bootWorker() {
  worker = new Worker('ear-worker.js', { type: 'module' });
  worker.onmessage = onWorkerMsg;
  worker.onerror = (e) => setStatus('Model failed to start: ' + (e.message || 'worker error'));
  worker.postMessage({ kind: 'init' });
}
function onWorkerMsg(e) {
  const m = e.data;
  if (m.kind === 'ready') {
    modelReady = true;
    setStatus(mode === 'sing'
      ? 'Ready — tap "Sing to me" and sing a tune'
      : 'Ready — tap "Listen to a song" and play music near the mic');
    $('#sub').textContent = 'Background AI: hears the audio → writes down every note → votes on the key → groups notes into chords.';
    for (const id of ['bListen','bSing','bUpload','bReset']) $('#'+id).disabled = false;
    $('#loadbar').style.width = '100%';
  } else if (m.kind === 'notes') {
    workerBusy = false;
    ingestNotes(m.notes);
  } else if (m.kind === 'error') {
    workerBusy = false;
    setStatus('Transcription hiccup: ' + m.message);
  }
}

// ---------- audio input ----------
function ensureCtx() {
  if (!actx) actx = new (window.AudioContext || window.webkitAudioContext)();
  if (actx.state === 'suspended') actx.resume();
  return actx;
}
function resampleTo22050(input, inRate) {
  if (inRate === SR) return input;
  const ratio = inRate / SR, outLen = Math.floor(input.length / ratio);
  const out = new Float32Array(outLen);
  for (let i = 0; i < outLen; i++) {
    const p = i * ratio, i0 = Math.floor(p), f = p - i0;
    out[i] = input[i0] * (1 - f) + (input[Math.min(i0 + 1, input.length - 1)] * f);
  }
  return out;
}
function pushPCM(chunk) {
  const need = pcmLen + chunk.length;
  if (!pcm || pcm.length < need) {
    const bigger = new Float32Array(Math.max(need, (pcm ? pcm.length : 0) * 2 || SR * 30));
    if (pcm) bigger.set(pcm.subarray(0, pcmLen));
    pcm = bigger;
  }
  pcm.set(chunk, pcmLen); pcmLen += chunk.length;
}
async function startMic(singMode) {
  if (!modelReady) return;
  reset();
  mode = singMode ? 'sing' : 'song';
  ensureCtx();
  try {
    stream = await navigator.mediaDevices.getUserMedia({ audio: { echoCancellation: false, noiseSuppression: false, autoGainControl: false } });
  } catch (err) {
    setStatus('Mic blocked — allow microphone access and try again.');
    return;
  }
  const src = actx.createMediaStreamSource(stream);
  const rate = actx.sampleRate;
  let useWorklet = true;
  try {
    const code = `class Cap extends AudioWorkletProcessor{process(i){const c=i[0]&&i[0][0];if(c)this.port.postMessage(c.slice(0));return true}}registerProcessor('earcap',Cap);`;
    await actx.audioWorklet.addModule(URL.createObjectURL(new Blob([code], { type: 'application/javascript' })));
    capNode = new AudioWorkletNode(actx, 'earcap');
    capNode.port.onmessage = (e) => pushPCM(resampleTo22050(e.data, rate));
  } catch (err) {
    useWorklet = false;
  }
  if (!useWorklet) {
    capNode = actx.createScriptProcessor(4096, 1, 1);
    capNode.onaudioprocess = (e) => pushPCM(resampleTo22050(e.inputBuffer.getChannelData(0), rate));
  }
  src.connect(capNode); capNode.connect(actx.destination);
  $('#bListen').disabled = $('#bSing').disabled = $('#bUpload').disabled = true;
  $('#bStop').disabled = false;
  setStatus(mode === 'sing' ? '🎙 Listening — sing something…' : '🎤 Listening — play the song…', true);
  micTimer = setInterval(pumpMic, 2000);
  pumpMic();
}
function pumpMic() {
  if (workerBusy || !modelReady) return;
  if (pcmLen < SR * 4) return;
  const winLen = SR * 4;
  const windowStart = baseSec + (pcmLen - winLen) / SR;
  const slice = pcm.slice(pcmLen - winLen, pcmLen);
  workerBusy = true;
  worker.postMessage({ kind: 'transcribe', id: ++jobId, pcm: slice, windowStart }, [slice.buffer]);
  if (pcmLen > SR * 90) {
    const drop = pcmLen - SR * 60;
    pcm.copyWithin(0, drop, pcmLen);
    pcmLen -= drop;
    baseSec += drop / SR;
  }
}
function stopMic() {
  clearInterval(micTimer); micTimer = null;
  if (stream) stream.getTracks().forEach(t => t.stop());
  if (capNode) { try { capNode.disconnect(); } catch (e) {} }
  capNode = null; stream = null;
  $('#bListen').disabled = $('#bSing').disabled = $('#bUpload').disabled = modelReady ? false : true;
  $('#bStop').disabled = true;
  if (allNotes.length) setStatus('Stopped. ' + learnLine());
}
async function uploadFile(file) {
  if (!modelReady || !file) return;
  reset();
  mode = 'song';
  ensureCtx();
  setStatus('Decoding ' + file.name + '…', true);
  try {
    const buf = await file.arrayBuffer();
    const ab = await actx.decodeAudioData(buf);
    let ch = ab.getChannelData(0);
    if (ab.numberOfChannels > 1) {
      const c1 = ab.getChannelData(1), mix = new Float32Array(ch.length);
      for (let i = 0; i < ch.length; i++) mix[i] = (ch[i] + c1[i]) / 2;
      ch = mix;
    }
    const mono = resampleTo22050(ch, ab.sampleRate);
    setStatus('Transcribing ' + file.name + ' — the neural net is listening…', true);
    $('#bStop').disabled = false;
    workerBusy = true;
    worker.postMessage({ kind: 'transcribe', id: ++jobId, pcm: mono, windowStart: 0 }, [mono.buffer]);
  } catch (err) {
    setStatus('Could not read that file: ' + err.message);
  }
}

// ---------- analysis ----------
function ingestNotes(notes) {
  let added = 0;
  for (const n of notes) {
    const k = n.midi + ':' + Math.round(n.start * 20);
    if (!seen.has(k)) { seen.add(k); allNotes.push(n); added++; }
  }
  $('#sub').textContent = pipelineLine();
  if (added) analyze();
}
function pipelineLine() {
  // What the AI is doing in the background, live.
  const bits = ['hearing audio', allNotes.length + ' notes written'];
  bits.push(keyInfo ? 'key found: ' + keyInfo.name : 'voting on the key…');
  bits.push(chords.length ? chords.length + ' chords grouped' : 'grouping chords…');
  if (learned) bits.push('loop learned ✓');
  return 'AI · ' + bits.join(' → ');
}
function analyze() {
  if (allNotes.length < 10) { setStatus('Listening… collecting notes (' + allNotes.length + '/10)', true); return; }
  keyInfo = EM.detectKey(allNotes);
  chords = EM.chordsOverTime(allNotes);
  const melody = EM.skyline(allNotes);

  const cur = chords[chords.length - 1];
  $('#chord').textContent = cur ? EM.chordName(cur) : '–';

  if (keyInfo) {
    $('#key').textContent = keyInfo.name;
    $('#keysub').textContent = keyInfo.oneLiner + ' · ' + Math.round(keyInfo.confidence * 100) + '% sure';
  } else {
    $('#key').textContent = '–';
    $('#keysub').textContent = 'Still listening — needs a few more notes…';
  }

  // Flowing melody: the latest notes stream across, newest last.
  const tail = melody.slice(-16);
  $('#melody').textContent = tail.length ? tail.map(n => EM.midiToName(n.midi)).join(' ') : '–';
  const top = tail[tail.length - 1];
  if (top && top.midi !== lastMelodyMidi) { lastMelodyMidi = top.midi; flashPiano(top.midi, 900); }

  let shown = [];
  if (mode === 'sing') {
    const backing = EM.harmonize(melody, keyInfo).slice(0, 4);
    const sig = backing.map(c => c.root + c.type).join('|');
    if (backing.length >= 2 && sig !== (learned && learned.sig)) {
      const t0m = melody.length ? melody[0].start : 0;
      learned = {
        chords: backing.map(c => ({ ...c, start: c.start - t0m })),
        sig,
        melody: melody.map(n => ({ ...n, start: n.start - t0m })),
      };
      onLearned('Found chords for your melody');
    }
    shown = backing;
  } else {
    const loop = EM.detectLoop(chords);
    if (loop) {
      const loop4 = loop.slice(0, 4);
      const sig = loop4.map(c => c.root + c.type).join('|');
      if (sig !== (learned && learned.sig)) {
        const ls = loop4[0].start, le = loop4[loop4.length - 1].start + loop4[loop4.length - 1].dur;
        const loopMelody = melody.filter(n => n.start >= ls - 0.1 && n.start < le + 0.3)
          .map(n => ({ ...n, start: n.start - ls }));
        learned = { chords: loop4.map(c => ({ ...c, start: c.start - ls })), sig, melody: loopMelody, loopDur: le - ls };
        onLearned('Heard the loop repeat — got it');
      }
    }
    shown = loop ? loop.slice(0, 4) : chords.slice(-4);
  }
  $('#prog').textContent = shown.length ? shown.map(EM.chordName).join(' → ') : '–';

  $('#learn').textContent = learnLine();
  updatePlan();
  $('#sub').textContent = pipelineLine();
  if (allNotes.length) setStatus(learned ? 'Learned ✓ — tap "Play it back"' : 'Listening… ' + learnLine(), !learned);
}
function learnLine() {
  if (learned) return mode === 'sing' ? 'Chords found for your melody ✓' : 'Loop learned ✓ (' + learned.chords.length + ' chords)';
  if (!chords.length) return 'No chords yet…';
  return 'Heard ' + chords.length + ' chord changes — waiting for the loop to repeat…';
}
function onLearned(msg) {
  $('#learn').textContent = '✓ ' + msg;
  $('#learn').classList.remove('pulse');
  $('#bPlay').disabled = false;
  $('#bLoop').disabled = false;
}
function updatePlan() {
  if (!learned || !keyInfo) { $('#plan').textContent = 'Nothing learned yet.'; return; }
  const nums = learned.chords.map(c => numOf(c, keyInfo)).join(' – ');
  $('#plan').textContent = (mode === 'sing' ? 'Your melody' : 'The melody') +
    ' (' + learned.melody.length + ' notes) over ' +
    learned.chords.map(EM.chordName).join(' – ') +
    '  ·  ' + nums + '  ·  in ' + keyInfo.name;
}
function numOf(c, key) {
  const deg = (c.root - key.tonic + 12) % 12;
  const map = key.minor
    ? { 0: '1', 2: '2', 3: '3', 5: '4', 7: '5', 8: '6', 10: '7' }
    : { 0: '1', 2: '2', 4: '3', 5: '4', 7: '5', 9: '6', 11: '7' };
  return map[deg] || EM.chordName(c);
}

// ---------- piano ----------
function buildPiano() {
  const pi = $('#pi');
  const whites = [60,62,64,65,67,69,71,72,74,76,77,79,81,83];
  const blacks = [61,63,66,68,70,73,75,78,80,82];
  const names = ['C','D','E','F','G','A','B'];
  whites.forEach(m => {
    const k = document.createElement('div');
    k.className = 'wk'; k.dataset.midi = m;
    k.textContent = names[[0,2,4,5,7,9,11].indexOf(m % 12)];
    pi.appendChild(k); pianoEl[m] = k;
  });
  blacks.forEach(m => {
    const wi = whites.filter(w => w < m).length;
    const k = document.createElement('div');
    k.className = 'bk'; k.dataset.midi = m;
    k.style.left = 'calc(12px + (100% - 24px) * ' + (wi / whites.length) + ')';
    pi.appendChild(k); pianoEl[m] = k;
  });
}
function flashPiano(midi, ms) {
  const el = pianoEl[midi];
  if (!el) return;
  el.classList.add('on');
  setTimeout(() => el.classList.remove('on'), ms || 700);
}
function scheduleFlash(midi, whenSec, ms) {
  const delay = Math.max(0, (whenSec - actx.currentTime) * 1000);
  playTimers.push(setTimeout(() => flashPiano(midi, ms), delay));
}

// ---------- playback ----------
function pianoNote(midi, when, dur, vel) {
  const f = EM.midiToFreq(midi);
  const g = actx.createGain();
  const o1 = actx.createOscillator(), o2 = actx.createOscillator();
  o1.type = 'triangle'; o1.frequency.value = f;
  o2.type = 'sine'; o2.frequency.value = f * 2;
  const g2 = actx.createGain(); g2.gain.value = 0.25;
  o1.connect(g); o2.connect(g2); g2.connect(g); g.connect(actx.destination);
  const peak = vel, dec = Math.max(dur, 1.6);
  g.gain.setValueAtTime(0.0001, when);
  g.gain.exponentialRampToValueAtTime(peak, when + 0.012);
  g.gain.exponentialRampToValueAtTime(0.0001, when + dec);
  o1.start(when); o2.start(when);
  const stopAt = when + dec + 0.1;
  o1.stop(stopAt); o2.stop(stopAt);
  playSrc.push(o1, o2);
}
function triadMidi(c) {
  const base = 48 + c.root;
  const third = c.type === 'm' || c.type === 'dim' ? 3 : 4;
  const fifth = c.type === 'dim' ? 6 : 7;
  const notes = [base, base + third, base + fifth];
  if (c.type === '7') notes.push(base + 10);
  return notes;
}
function playBack() {
  if (!learned) return;
  ensureCtx();
  stopPlayback();
  const t0 = actx.currentTime + 0.15;
  for (const c of learned.chords) {
    for (const m of triadMidi(c)) {
      pianoNote(m, t0 + c.start, Math.min(c.dur + 0.4, 3), 0.16);
      scheduleFlash(m + 12, t0 + c.start, Math.min(c.dur, 2.5) * 1000);
    }
  }
  for (const n of learned.melody) {
    pianoNote(n.midi, t0 + n.start, Math.min(n.dur + 0.25, 2.5), 0.5);
    scheduleFlash(n.midi, t0 + n.start, Math.min(n.dur + 0.3, 1.5) * 1000);
  }
  const total = Math.max(
    ...learned.chords.map(c => c.start + c.dur),
    ...learned.melody.map(n => n.start + n.dur), 1);
  setStatus('▶ Playing what it learned…', true);
  if (loopOn) playTimers.push(setTimeout(playBack, (total + 0.6) * 1000));
  else playTimers.push(setTimeout(() => setStatus('Done — tap "Play it back" to hear it again'), total * 1000 + 800));
}
function stopPlayback() {
  playTimers.forEach(clearTimeout); playTimers = [];
  playSrc.forEach(o => { try { o.stop(); } catch (e) {} });
  playSrc = [];
  for (const m in pianoEl) pianoEl[m].classList.remove('on');
}

// ---------- misc ----------
function setStatus(t, pulse) {
  $('#status').textContent = t;
  $('#status').classList.toggle('pulse', !!pulse);
}
function reset() {
  stopMic(); stopPlayback();
  pcm = null; pcmLen = 0; baseSec = 0; workerBusy = false;
  allNotes = []; seen = new Set(); chords = []; learned = null; keyInfo = null;
  lastMelodyMidi = -1;
  $('#key').textContent = '–'; $('#keysub').textContent = 'Listening…';
  $('#chord').textContent = '–'; $('#prog').textContent = '–'; $('#melody').textContent = '–';
  $('#learn').textContent = 'Waiting for music…'; $('#plan').textContent = 'Nothing learned yet.';
  $('#bPlay').disabled = true; $('#bLoop').disabled = true;
  loopOn = false; $('#bLoop').textContent = '🔁 Loop: off';
  setStatus(modelReady ? 'Ready — tap Listen, Sing, or Upload' : 'Loading the neural net…');
  if (modelReady) $('#sub').textContent = 'Background AI: hears the audio → writes down every note → votes on the key → groups notes into chords.';
}

// ---------- wire up ----------
$('#bListen').onclick = () => startMic(false);
$('#bSing').onclick = () => startMic(true);
$('#bUpload').onclick = () => $('#file').click();
