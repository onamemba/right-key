<html lang="en"><head><meta charset="utf-8">

<style>
:root{--bg:#f5f3f5;--ink:#000;--mut:#6c6c70;--g:rgba(255,255,255,.62);--gb:rgba(255,255,255,.8);--ln:rgba(0,0,0,.08);--c1:#f6cfa8;--c2:#f4c3d6;--c3:#d8cdf5;--c4:#f7efb8;--c5:#cfe3f6;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#000;--ink:#fff;--mut:#98989f;--g:rgba(44,44,46,.55);--gb:rgba(255,255,255,.14);--ln:rgba(255,255,255,.1);--c1:#5a3b2a;--c2:#5a2b44;--c3:#34285c;--c4:#4f4a22;--c5:#1f3a55}}
:root[data-theme="dark"]{--bg:#000;--ink:#fff;--mut:#98989f;--g:rgba(44,44,46,.55);--gb:rgba(255,255,255,.14);--ln:rgba(255,255,255,.1);--c1:#5a3b2a;--c2:#5a2b44;--c3:#34285c;--c4:#4f4a22;--c5:#1f3a55}
*{box-sizing:inherit;-webkit-tap-highlight-color:transparent}

.atmos i:nth-child(2){background:radial-gradient(35% 30% at 30% 75%,var(--c4),transparent 70%),radial-gradient(30% 28% at 80% 55%,var(--c5),transparent 70%);animation:spin 140s linear infinite reverse}

main{position:relative;z-index:1;max-width:860px;margin:0 auto;padding:18px 16px 40px;display:grid;gap:14px;grid-template-columns:1fr 1fr}

.card{background:var(--g);-webkit-backdrop-filter:blur(28px) saturate(180%);backdrop-filter:blur(28px) saturate(180%);border:1px solid var(--gb);border-radius:26px;padding:20px;box-shadow:0 8px 30px rgba(0,0,0,.08),inset 0 1px 0 var(--gb)}

.root{font-size:clamp(3rem,14vw,5rem);font-weight:700;letter-spacing:-.05em;line-height:1.1}

</style></head><body><div class="atmos"><i></i><i></i></div><main>
<header><h1>🎧 Play by Ear</h1><a href="index.html">← Right Key</a></header>

<section class="card wide">
  <div class="mut">Listener</div>
  <div class="q" id="status">Ready — tap Listen, Sing, or Upload.</div>
  <div class="sub" id="sub">Listens to the sound itself — key, chords, loop and tempo, live.</div>
  <div class="bar"><i id="loadbar"></i></div>
  <div class="btns">
    <button id="bListen" class="go">🎤 Listen to a song</button>
    <button id="bSing">🎙 Sing to me</button>
    <button id="bUpload">📁 Upload audio</button>
    <input type="file" id="file" accept="audio/*" hidden>
    <button id="bStop" disabled>⏹ Stop</button>
    <button id="bPlay" class="go" disabled>🎹 Play along</button>
    <button id="bLoop" disabled>🔁 Loop: on</button>
    <button id="bReset">Reset</button>
  </div>
</section>

<section class="card">
  <div class="mut">Key</div>
  <div class="root" id="key">–</div>
  <div class="sub" id="keysub">Listening…</div>
</section>

<section class="card">
  <div class="mut">Now playing</div>
  <div class="num" id="chord">–</div>
  <div class="q" id="learn">Waiting for music…</div>
  <div class="nums" id="prog">–</div>
  <div class="sub" id="bpm"></div>
</section>

<section class="card wide">
  <div class="mut">Piano — you're in the band</div>
  <div id="pi" class="piano"></div>
  <div class="legend"><span><span class="dot b"></span>chord you're playing</span><span><span class="dot r"></span>next chord</span></div>
  <div class="sub" id="plan">Nothing learned yet.</div>
</section>
</main>

<script src="ear-dsp.js"></script>
<script src="ear-music.js"></script>
<script>
const $ = s => document.querySelector(s);
const EM = window.EarMusic;

let ear = EarDSP.create();
let actx = null, analyser = null, micStream = null, songSource = null, songBuffer = null;
let fb = null, tb = null, rafId = null;
let mode = 'song';               // 'song' | 'sing'
let listening = false, songStartCtx = 0;
let chordTimeline = [];          // { r, t, start } song-relative seconds (upload) or session seconds (mic)
let sessionT0 = 0;
let learned = null;              // { chords:[4], key, bpm }
let playing = false, loopOn = true, playTimers = [], playSrc = [];
let pianoBus = null;
const pianoEl = {};

// ---------- audio plumbing ----------
function ensureCtx() {
  if (!actx) actx = new (window.AudioContext || window.webkitAudioContext)();
  if (actx.state === 'suspended') actx.resume();
  return actx;
}
function ensureAnalyser() {
  ensureCtx();
  if (!analyser) {
    analyser = actx.createAnalyser();
    analyser.fftSize = 16384;
    analyser.smoothingTimeConstant = 0;
    fb = new Float32Array(analyser.frequencyBinCount);
    tb = new Float32Array(analyser.fftSize);
  }
  return analyser;
}
function nowSec() { return actx.currentTime - sessionT0; }

function analyzeFrame() {
  if (!listening) return;
  rafId = requestAnimationFrame(analyzeFrame);
  analyser.getFloatFrequencyData(fb);
  analyser.getFloatTimeDomainData(tb);
  const t = nowSec();
  const ev = ear.frame(fb, tb, actx.sampleRate, analyser.fftSize, performance.now(), t);
  if (ev.chord) {
    const c = ev.chord;
    chordTimeline.push({ r: c.r, t: c.t, start: t });
    $('#chord').textContent = EarDSP.chordName(c);
    updateProgression();
  }
  if (ev.keyChanged || ev.chord) updateKey();
  if (ev.loopFound && !learned) onLoopLearned();
  updateTempo();
  $('#sub').textContent = pipelineLine();
}
function updateKey() {
  const k = ear.getKey();
  if (k && !k.early) {
    $('#key').textContent = k.name;
    $('#keysub').textContent = k.oneLiner;
  } else if (k) {
    $('#key').textContent = k.name + '?';
    $('#keysub').textContent = 'Early guess — keep playing…';
  }
}
function updateProgression() {
  const loop = ear.getLoop();
  const shown = loop ? loop.slice(0, 4) : chordTimeline.slice(-4);
  $('#prog').textContent = shown.length ? shown.map(EarDSP.chordName).join(' → ') : '–';
  if (shown.length && !learned) $('#learn').textContent = 'Heard ' + chordTimeline.length + ' chord changes — waiting for the loop…';
}
function updateTempo() {
  const tp = ear.getTempo();
  if (tp) $('#bpm').textContent = '♪ ' + tp.bpm + ' BPM';
}
function pipelineLine() {
  const st = ear.getStats();
  const k = ear.getKey();
  const bits = ['listening', st.frames + ' frames'];
  bits.push(k && !k.early ? 'key: ' + k.name : 'finding the key…');
  bits.push(chordTimeline.length ? chordTimeline.length + ' chords' : 'hearing chords…');
  const tp = ear.getTempo();
  bits.push(tp ? tp.bpm + ' BPM' : 'feeling the tempo…');
  if (learned) bits.push('loop learned ✓');
  return bits.join(' → ');
}
function onLoopLearned() {
  const loop = ear.getLoop().slice(0, 4);
  const k = ear.getKey(), tp = ear.getTempo();
  // Chord durations from the timeline: how long each chord lasted when heard.
  const durs = loop.map((c) => {
    const cur = chordTimeline.filter(x => x.r === c.r && x.t === c.t).pop();
    const nxt = cur ? chordTimeline[chordTimeline.indexOf(cur) + 1] : null;
    return (nxt ? nxt.start - cur.start : 2);
  });
  learned = {
    chords: loop.map((c, i) => ({ r: c.r, t: c.t, dur: Math.min(8, Math.max(0.6, durs[i] || 2)) })),
    key: k, bpm: tp ? tp.bpm : null,
  };
  $('#learn').textContent = '✓ Loop learned — tap "Play along" to join the band';
  $('#bPlay').disabled = false;
  $('#bLoop').disabled = false;
  updatePlan();
  setStatus('Learned ✓ — you\'re up. Tap "Play along".');
}

// ---------- mic / upload ----------
async function startMic(singMode) {
  reset();
  mode = singMode ? 'sing' : 'song';
  ensureAnalyser();
  try {
    micStream = await navigator.mediaDevices.getUserMedia({ audio: { echoCancellation: false, noiseSuppression: false, autoGainControl: false } });
  } catch (e) { setStatus('Mic blocked — allow microphone access and try again.'); return; }
  const src = actx.createMediaStreamSource(micStream);
  src.connect(analyser);
  sessionT0 = actx.currentTime;
  listening = true;
  $('#bListen').disabled = $('#bSing').disabled = $('#bUpload').disabled = true;
  $('#bStop').disabled = false;
  setStatus(mode === 'sing' ? '🎙 Listening — sing something…' : '🎤 Listening — play the song…', true);
  $('#loadbar').style.width = '100%';
  analyzeFrame();
}
function stopListening() {
  listening = false;
  if (rafId) cancelAnimationFrame(rafId);
  rafId = null;
  if (micStream) micStream.getTracks().forEach(t => t.stop());
  micStream = null;
  if (songSource) { try { songSource.stop(); } catch (e) {} songSource = null; }
  try { analyser && analyser.disconnect(); } catch (e) {}
  $('#bListen').disabled = $('#bSing').disabled = $('#bUpload').disabled = false;
  $('#bStop').disabled = true;
}
async function uploadFile(file) {
  if (!file) return;
  reset();
  mode = 'song';
  ensureAnalyser();
  setStatus('Decoding ' + file.name + '…', true);
  try {
    const buf = await file.arrayBuffer();
    songBuffer = await actx.decodeAudioData(buf);
  } catch (e) { setStatus('Could not read that file.'); return; }
  songSource = actx.createBufferSource();
  songSource.buffer = songBuffer;
  songSource.connect(analyser);
  analyser.connect(actx.destination); // you hear it while it learns
  sessionT0 = actx.currentTime + 0.1;
  songSource.start(sessionT0);
  songSource.onended = () => { if (listening) { stopListening(); setStatus('Song ended. ' + ($('#bPlay').disabled ? 'Not enough repetition to learn the loop — try a longer section.' : 'Tap "Play along".')); } };
  listening = true;
  $('#bListen').disabled = $('#bSing').disabled = $('#bUpload').disabled = true;
  $('#bStop').disabled = false;
  setStatus('🎧 Learning "' + file.name + '" as it plays…', true);
  $('#loadbar').style.width = '100%';
  analyzeFrame();
}

// ---------- sing mode harmony ----------
function singBacking() {
  // Build chords from the tracked pitch melody + detected key.
  const mel = ear.getMelody().map(m => ({ midi: m.midi, start: m.at, dur: 0.4 }));
  const k = ear.getKey();
  if (!mel.length || !k || k.early) return [];
  const key = { tonic: k.k, minor: !!k.m };
  return EM.harmonize(mel, key).slice(0, 4)
    .map(c => ({ r: c.root, t: c.type, dur: c.dur, start: c.start }));
}

// ---------- piano ----------
function buildPiano() {
  const pi = $('#pi');
  const whites = [60,62,64,65,67,69,71,72,74,76,77,79,81,83];
  const blacks = [61,63,66,68,70,73,75,78,80,82];
  const names = ['C','D','E','F','G','A','B'];
  whites.forEach(m => {
    const k = document.createElement('div');
    k.className = 'wk'; k.dataset.midi = m;
    k.textContent = names[[0,2,4,5,7,9,11].indexOf(m % 12)];
    pi.appendChild(k); pianoEl[m] = k;
  });
  blacks.forEach(m => {
    const wi = whites.filter(w => w < m).length;
    const k = document.createElement('div');
    k.className = 'bk'; k.dataset.midi = m;
    k.style.left = 'calc(12px + (100% - 24px) * ' + (wi / whites.length) + ')';
    pi.appendChild(k); pianoEl[m] = k;
  });
}
function initPiano() {
  ensureCtx();
  if (pianoBus) return;
  const comp = actx.createDynamicsCompressor();
  comp.threshold.value = -18; comp.ratio.value = 4;
  const filter = actx.createBiquadFilter();
  filter.type = 'lowpass'; filter.frequency.value = 5200; filter.Q.value = 0.4;
  const conv = actx.createConvolver();
  conv.buffer = makeImpulse(2.4, 2.6);
  const wet = actx.createGain(); wet.gain.value = 0.32;
  pianoBus = actx.createGain(); pianoBus.gain.value = 0.9;
  pianoBus.connect(comp);
  pianoBus.connect(conv); conv.connect(wet); wet.connect(comp);
  comp.connect(filter); filter.connect(actx.destination);
}
function makeImpulse(dur, decay) {
  const rate = actx.sampleRate, len = Math.floor(rate * dur);
  const buf = actx.createBuffer(2, len, rate);
  for (let ch = 0; ch < 2; ch++) {
    const d = buf.getChannelData(ch);
    for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, decay);
  }
  return buf;
}
function pianoNote(midi, when, dur, vel) {
  initPiano();
  const f = EM.midiToFreq(midi);
  const ring = Math.max(dur, 1.1) + 1.8; // sustain pedal down
  const out = actx.createGain();
  out.gain.setValueAtTime(0.0001, when);
  out.gain.exponentialRampToValueAtTime(Math.max(vel, 0.001), when + 0.006);
  out.gain.exponentialRampToValueAtTime(0.0001, when + ring);
  out.connect(pianoBus);
  const partials = [[1, 1.0, 1.0], [2, 0.42, 0.62], [3, 0.2, 0.45], [4.01, 0.1, 0.32], [5.02, 0.05, 0.22]];
  for (const [mult, amp, dscale] of partials) {
    const o = actx.createOscillator();
    o.type = 'sine'; o.frequency.value = f * mult;
    if (mult === 1) o.detune.value = Math.random() * 4 - 2;
    const gn = actx.createGain();
    gn.gain.setValueAtTime(amp, when);
    gn.gain.exponentialRampToValueAtTime(0.0001, when + ring * dscale);
    o.connect(gn); gn.connect(out);
    o.start(when); o.stop(when + ring + 0.1);
    playSrc.push(o);
  }
}
function fullChord(c) {
  const third = c.t === 'm' ? 3 : 4;
  const bassRoot = 36 + c.r, b = 60 + c.r;
  return { bass: [bassRoot, bassRoot + 7], keys: [b, b + third, b + 7, b + 12] };
}
function clearChordColors() {
  for (const m in pianoEl) pianoEl[m].classList.remove('cur', 'next');
}

// ---------- play along ----------
function scheduleChordSound(c, when, dur) {
  const v = fullChord(c);
  for (const m of v.bass) pianoNote(m, when, dur, 0.12);
  for (const m of v.keys) pianoNote(m, when, dur, 0.15);
}
function scheduleChordColors(idx, when, seq) {
  const delay = Math.max(0, (when - actx.currentTime) * 1000);
  playTimers.push(setTimeout(() => {
    if (!playing) return;
    clearChordColors();
    const cur = seq[idx], nxt = seq[(idx + 1) % seq.length];
    for (const m of fullChord(cur).keys) { const el = pianoEl[m]; if (el) el.classList.add('cur'); }
    for (const m of fullChord(nxt).keys) { const el = pianoEl[m]; if (el && !el.classList.contains('cur')) el.classList.add('next'); }
    $('#chord').textContent = EarDSP.chordName(cur);
  }, delay));
}
function startPlayAlong() {
  ensureCtx(); initPiano();
  stopPlayback();
  let seq, songMode;
  if (mode === 'sing') {
    const backing = singBacking();
    if (!backing.length) { setStatus('Sing a bit more first — I need your melody.'); return; }
    seq = backing; songMode = false;
  } else if (songBuffer) {
    seq = chordTimeline.map(c => ({ r: c.r, t: c.t, dur: 2 })); // durations set below
    for (let i = 0; i < seq.length; i++) {
      const cur = chordTimeline[i], nxt = chordTimeline[i + 1];
      seq[i].dur = nxt ? Math.min(8, Math.max(0.5, nxt.start - cur.start)) : 2;
    }
    songMode = true;
  } else {
    if (!learned) return;
    seq = learned.chords; songMode = false;
  }
  if (!seq.length) return;
  playing = true;
  $('#bPlay').textContent = '⏹ Stop piano';
  $('#bPlay').onclick = stopPlayAlong;
  const t0 = actx.currentTime + 0.3;
  if (songMode) {
    songSource = actx.createBufferSource();
    songSource.buffer = songBuffer;
    songSource.connect(actx.destination);
    songSource.start(t0);
    setStatus('🎹 Playing along with the song — you\'re the pianist', true);
    seq.forEach((c, i) => {
      scheduleChordSound(c, t0 + chordTimeline[i].start, c.dur);
      scheduleChordColors(i, t0 + chordTimeline[i].start, seq);
    });
    playTimers.push(setTimeout(() => { if (playing) stopPlayAlong(); }, (songBuffer.duration + 1.5) * 1000));
  } else {
    setStatus('🎹 Playing along — holding the groove', true);
    playLoopIteration(t0, seq);
  }
}
function playLoopIteration(t0, seq) {
  if (!playing) return;
  let t = t0;
  seq.forEach((c, i) => {
    scheduleChordSound(c, t, c.dur);
    scheduleChordColors(i, t, seq);
    t += c.dur;
  });
  const loopDur = t - t0;
  playTimers.push(setTimeout(() => {
    if (!playing) return;
    if (loopOn) playLoopIteration(actx.currentTime + 0.08, seq);
    else stopPlayAlong();
  }, loopDur * 1000));
}
function stopPlayAlong() {
  playing = false;
  stopPlayback();
  if (songSource) { try { songSource.stop(); } catch (e) {} songSource = null; }
  $('#bPlay').textContent = '🎹 Play along';
  $('#bPlay').onclick = startPlayAlong;
  setStatus('Stopped — the band takes five.');
}
function stopPlayback() {
  playTimers.forEach(clearTimeout); playTimers = [];
  playSrc.forEach(o => { try { o.stop(); } catch (e) {} });
  playSrc = [];
  clearChordColors();
}

// ---------- misc ----------
function setStatus(t, pulse) {
  $('#status').textContent = t;
  $('#status').classList.toggle('pulse', !!pulse);
}
function updatePlan() {
  if (!learned || !learned.key) { $('#plan').textContent = 'Nothing learned yet.'; return; }
  const k = learned.key;
  const tonic = k.m ? (k.k + 3) % 12 : k.k;
  const deg = c => {
    const d = (c.r - tonic + 12) % 12;
    const map = k.m ? {0:'1',2:'2',3:'3',5:'4',7:'5',8:'6',10:'7'} : {0:'1',2:'2',4:'3',5:'4',7:'5',9:'6',11:'7'};
    return map[d] || EarDSP.chordName(c);
  };
  const tp = learned.bpm ? '  ·  ' + learned.bpm + ' BPM' : '';
  $('#plan').textContent = 'Your part: ' + learned.chords.map(EarDSP.chordName).join(' – ') +
    '  ·  ' + learned.chords.map(deg).join(' – ') + '  ·  in ' + k.name + tp;
}
function reset() {
  stopListening(); stopPlayAlong();
  playing = false;
  $('#bPlay').textContent = '🎹 Play along';
  $('#bPlay').onclick = startPlayAlong;
  ear = EarDSP.create();
  chordTimeline = []; learned = null;
  songBuffer = null;
  $('#key').textContent = '–'; $('#keysub').textContent = 'Listening…';
  $('#chord').textContent = '–'; $('#prog').textContent = '–'; $('#bpm').textContent = '';
  $('#learn').textContent = 'Waiting for music…'; $('#plan').textContent = 'Nothing learned yet.';
  $('#sub').textContent = 'Listens to the sound itself — key, chords, loop and tempo, live.';
  $('#bPlay').disabled = true; $('#bLoop').disabled = true;
  loopOn = true; $('#bLoop').textContent = '🔁 Loop: on';
  $('#loadbar').style.width = '0%';
  setStatus('Ready — tap Listen, Sing, or Upload.');
}

// ---------- wire up ----------
$('#bListen').onclick = () => startMic(false);
$('#bSing').onclick = () => startMic(true);
$('#bUpload').onclick = () => $('#file').click();
$('#file').onchange = (e) => uploadFile(e.target.files[0]);
$('#bStop').onclick = () => { stopListening(); stopPlayAlong(); if (chordTimeline.length && !learned) setStatus('Stopped. Heard ' + chordTimeline.length + ' chord changes.'); };
$('#bPlay').onclick = startPlayAlong;
$('#bLoop').onclick = () => { loopOn = !loopOn; $('#bLoop').textContent = '🔁 Loop: ' + (loopOn ? 'on' : 'off'); };
$('#bReset').onclick = reset;

buildPiano();
</script>
</body></html>
