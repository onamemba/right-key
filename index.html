<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-capable" content="yes">
<title>Right Key</title>
<style>
:root{--bg:#f2f2f7;--ink:#000;--mut:#6c6c70;--g:rgba(255,255,255,.62);--gb:rgba(255,255,255,.8);--ln:rgba(0,0,0,.08);--bg:#f5f3f5;--c1:#f6cfa8;--c2:#f4c3d6;--c3:#d8cdf5;--c4:#f7efb8;--c5:#cfe3f6;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#000;--ink:#fff;--mut:#98989f;--g:rgba(44,44,46,.55);--gb:rgba(255,255,255,.14);--ln:rgba(255,255,255,.1);--c1:#5a3b2a;--c2:#5a2b44;--c3:#34285c;--c4:#4f4a22;--c5:#1f3a55}}
:root[data-theme="dark"]{--bg:#000;--ink:#fff;--mut:#98989f;--g:rgba(44,44,46,.55);--gb:rgba(255,255,255,.14);--ln:rgba(255,255,255,.1);--c1:#5a3b2a;--c2:#5a2b44;--c3:#34285c;--c4:#4f4a22;--c5:#1f3a55}
*{box-sizing:inherit;-webkit-tap-highlight-color:transparent}
body{margin:0;min-height:100vh;color:var(--ink);font:17px/1.35 -apple-system,BlinkMacSystemFont,"SF Pro Display","Helvetica Neue",Arial,sans-serif;background:var(--bg)}
main{position:relative;z-index:1;max-width:860px;margin:0 auto;padding:18px 16px 40px;display:grid;gap:14px;grid-template-columns:1fr 1fr}
header{grid-column:1/-1;display:flex;justify-content:space-between;align-items:center}
h1{font-size:1.9rem;letter-spacing:-.02em;margin:0}
.card{background:var(--g);-webkit-backdrop-filter:blur(28px) saturate(180%);backdrop-filter:blur(28px) saturate(180%);border:1px solid var(--gb);border-radius:26px;padding:20px;box-shadow:0 8px 30px rgba(0,0,0,.08),inset 0 1px 0 var(--gb);transition:transform .25s,box-shadow .25s}
.card:hover{transform:translateY(-2px);box-shadow:0 14px 40px rgba(0,0,0,.13),inset 0 1px 0 var(--gb)}
.wide{grid-column:1/-1}
.mut{color:var(--mut);font-size:.85rem;font-weight:500;letter-spacing:.02em;text-transform:uppercase}
.sub{color:var(--mut);font-size:.95rem}
.root{font-size:clamp(5rem,22vw,8.5rem);font-weight:700;letter-spacing:-.05em;line-height:1}
.num{font-size:clamp(4.5rem,20vw,7.5rem);font-weight:700;letter-spacing:-.04em;line-height:1}
.q{font-size:1.4rem;font-weight:600}
.btns{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
button,select{font:inherit;font-weight:600;font-size:.95rem;color:var(--ink);background:var(--g);-webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px);border:1px solid var(--gb);border-radius:999px;padding:10px 18px;cursor:pointer;transition:transform .15s,background .2s}
button:hover,select:hover{transform:translateY(-1px);background:var(--gb)}button:active{transform:scale(.96)}
button:focus-visible,select:focus-visible{outline:3px solid var(--ink);outline-offset:2px}
button.go,button.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.bar{height:6px;background:var(--ln);border-radius:3px;overflow:hidden;margin:10px 0 4px}.bar i{display:block;height:100%;width:0;background:var(--ink);transition:width .2s}
.row{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}
.chip{background:var(--g);border:1px solid var(--gb);border-radius:20px;padding:10px 16px;text-align:center;min-width:76px;transition:transform .2s,background .2s}
.chip:hover{transform:translateY(-2px)}.chip b{display:block;font-size:2rem;letter-spacing:-.03em}.chip span{color:var(--mut);font-size:.95rem}
.chip.cur{background:var(--ink);color:var(--bg)}.chip.cur span{color:var(--bg);opacity:.7}
.nums{font-size:clamp(1.8rem,7vw,2.8rem);font-weight:700;letter-spacing:.08em;margin-top:4px}
.badge{display:inline-block;font-size:.8rem;font-weight:600;padding:4px 10px;border-radius:999px;background:var(--ln)}
.two{display:flex;gap:28px;margin-top:10px}.two b{font-size:1.5rem}
@media(max-width:640px){main{grid-template-columns:1fr}}
.chip{font:inherit;color:var(--ink);cursor:pointer}
.atmos{position:fixed;inset:0;z-index:0;overflow:hidden;pointer-events:none}
.atmos i{position:absolute;inset:-35%;filter:blur(48px);will-change:transform}
.atmos i:nth-child(1){background:radial-gradient(40% 35% at 25% 30%,var(--c1),transparent 70%),radial-gradient(35% 30% at 75% 25%,var(--c2),transparent 70%),radial-gradient(40% 35% at 70% 75%,var(--c3),transparent 70%);animation:spin 90s linear infinite}
.atmos i:nth-child(2){background:radial-gradient(35% 30% at 30% 75%,var(--c4),transparent 70%),radial-gradient(30% 28% at 80% 55%,var(--c5),transparent 70%);animation:spin 140s linear infinite reverse}
@keyframes spin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.atmos i{animation:none}}
.piano{position:relative;display:flex;gap:4px;height:160px;margin-top:8px;padding:12px;border-radius:26px;background:var(--g);-webkit-backdrop-filter:blur(24px) saturate(180%);backdrop-filter:blur(24px) saturate(180%);border:1px solid var(--gb);box-shadow:0 8px 30px rgba(0,0,0,.08);touch-action:manipulation}
.wk,.bk{-webkit-backdrop-filter:none;backdrop-filter:none;border:0;cursor:pointer;font:inherit;transition:background .15s,transform .1s}
.wk{flex:1;min-width:0;background:#fff;color:#6e6e73;border-radius:0 0 14px 14px;padding:0 0 12px;box-shadow:0 1px 2px rgba(0,0,0,.06);display:flex;flex-direction:column;align-items:center;justify-content:flex-end;font-size:clamp(.8rem,3.6vw,1.5rem);font-weight:800}
.wk small{font-size:.5em;font-weight:600;opacity:.65}
.wk:hover{background:#f7f7fa;transform:none}.wk:active{transform:scale(.98)}
.bk{position:absolute;top:12px;height:86px;width:calc((100% - 24px)/8*.6);transform:translateX(-50%);background:#1c1c1e;border-radius:0 0 12px 12px;z-index:2;padding:0}
.bk:hover,.bk:active{background:#3a3a3c;transform:translateX(-50%)}
.wk.hit{background:#e5e5ea}.bk.hit{background:#48484a}
.wk.rh{background:#f8d58a}.bk.rh{background:#d9962b}.wk.lh{background:#9ccbff}.bk.lh{background:#3b82d6}
</style></head><body><div class="atmos"><i></i><i></i></div>
<main>
<header><h1>Right Key</h1><span class="badge" id="msg">Hold the phone near the band</span></header>
<section class="card"><div class="mut">Root note</div><div class="root" id="root">–</div><div class="q" id="qual">Listening for the key</div><div class="sub" id="kc"></div>
<div class="btns"><button id="st" class="go">Start</button><button id="pr">Play root</button><button id="lk">Lock key</button><select id="sk" aria-label="Set key"><option value="">Set key</option></select><button id="rs">Reset</button></div></section>
<section class="card"><div class="mut">Chord now</div><div class="num" id="num">–</div><div class="q" id="nm"></div><div class="bar"><i id="cf"></i></div>
<div class="two"><div><div class="mut">Bass</div><b id="bs">–</b></div><div><div class="mut">Voice</div><b id="nt">–</b> <span class="sub" id="cn"></span></div></div></section>
<section class="card wide"><div style="display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap"><div><div class="mut">Chord progression</div><div class="nums" id="nums">–</div></div><span class="badge" id="lp">Listening for the loop…</span></div>
<div class="row" id="pg"></div><div class="btns"><button id="pp" class="go">Play progression</button><button id="pa">Play along</button></div>
<div class="mut" style="margin-top:20px">Piano</div><div class="sub" id="pn">Tap a chord above or press the keys</div><div class="mut" style="margin-top:10px">Right hand</div><div id="pi" class="piano"></div><div class="mut" style="margin-top:10px">Left hand</div><div id="pl" class="piano"></div></section>
<script>
const $=s=>document.querySelector(s);
const NN=['C','C#','D','Eb','E','F','F#','G','Ab','A','Bb','B'],LAB=['1','♭2','2','♭3','3','4','♯4','5','♭6','6','♭7','7'];
const MAJ=[6.35,2.23,3.48,2.33,4.38,4.09,2.52,5.19,2.39,3.66,2.29,2.88],MIN=[6.33,2.68,3.52,5.38,2.6,3.53,2.54,4.75,3.98,2.69,3.34,3.17];
const TY=[{n:'',s:[0,4,7]},{n:'m',s:[0,3,7]}].map(t=>{const v=Array(12).fill(0);t.s.forEach((i,j)=>v[i]=j?.9:1.2);const m=Math.hypot(...v);t.v=v.map(x=>x/m);return t});
const DIA={0:['','7'],2:['m'],4:['m'],5:['','7'],7:['','7'],9:['m']}; // chords that fit a major key, offset from tonic
let paused=false,playing=null,outG=null,seqA=[],lps=null,mute=0,ctx,an,fb,tb,sus,stream,wl,run=false,L=Array(12).fill(0),loud=0,key=null,locked=false,cur=null,cand='',stab=0,prog=[];
const base=()=>key?(key.m?(key.k+3)%12:key.k):null;
const pr=(a,k)=>{const n=12,ma=a.reduce((x,y)=>x+y)/n,mb=k.reduce((x,y)=>x+y)/n;let d=0,x=0,y=0;for(let i=0;i<n;i++){d+=(a[i]-ma)*(k[i]-mb);x+=(a[i]-ma)**2;y+=(k[i]-mb)**2}return d/Math.sqrt(x*y||1)};
const rot=(p,k)=>p.map((_,i)=>p[(i-k+12)%12]);
let bh=Array(12).fill(0),rKey=null,mSc=0,minorF=false;
const isRot=(a,b)=>a.length==b.length&&a.some((_,k)=>a.every((p,i)=>sg(p)==sg(b[(i+k)%b.length])));
const sg=p=>p.r+(p.t=='m'?'m':'');
function detect(){const s=seqA,n=s.length;for(let p=2;p<=8&&2*p<=n;p++){let j=n-1,m=0;while(j-p>=0&&sg(s[j])==sg(s[j-p])){m++;j--}if(m<(p==2?4:p-1))continue;const i=n-(m+p),l=s.slice(i,i+p);if(new Set(l.map(sg)).size<2)continue;l.dur=l.map((c,k)=>{const d=[];for(let j=i+k;j+1<n;j+=p){if(sg(s[j])!=sg(c))break;d.push(s[j+1].at-s[j].at)}return d.length?d.sort((a,b)=>a-b)[d.length>>1]:null});return l}return null}
const src=()=>lps||(seqA.length?seqA:prog);
function findKey(){const tw=src().reduce((a,p)=>a+1+Math.min(p.n||0,300)/60,0)||1,bsum=bh.reduce((a,b)=>a+b)||1,sc=[];
 for(let R=0;R<12;R++){let ch=0;
  src().forEach((p,i)=>{const o=(p.r-R+12)%12,ok=(DIA[o]||[]).includes(p.t),w=(1+Math.min(p.n||0,300)/60);ch+=(ok?w:-.5*w)/tw;if(!lps&&i==0&&o==0&&p.t!='m')ch+=seqA.length<4?.5:.25});
  const b=(bh[R]+.9*bh[(R+9)%12]+.4*bh[(R+7)%12])/bsum,maj=pr(L,rot(MAJ,R)),mn=pr(L,rot(MIN,(R+9)%12));
  sc.push({R,maj,mn,s:Math.max(maj,mn)+.7*ch+.9*b})}
 sc.sort((a,b)=>b.s-a.s);let t=sc[0];if(rKey!==null&&t.R!==rKey){const o=sc.find(x=>x.R==rKey);if(o&&t.s-o.s<.15)t=o}rKey=t.R;let mw=0;
 src().forEach(p=>{const o=(p.r-t.R+12)%12,w=1+Math.min(p.n||0,300)/60;if(o==0&&p.t!='m')mw-=w;if(o==9&&p.t=='m')mw+=w});
 mSc=mSc*.8+.2*(.4*mw/tw+1.2*(bh[(t.R+9)%12]-bh[t.R])/bsum);minorF=minorF?mSc>.25:mSc>.55;const minor=minorF;
 return{k:minor?(t.R+9)%12:t.R,m:minor?1:0,gap:t.s-sc[1].s,early:!lps&&(src().length<3||loud<240)}}
function setKey(){key=findKey();showKey(key.k,key.m);$('#kc').textContent=(key.early?'Early guess · ':key.gap>.1?'Confident · ':'Still learning · ')+(key.m?'1 = '+NN[base()]:'tap Set key if wrong')}
function score(c,r,t,bass){let d=0;for(let i=0;i<12;i++)d+=c[(i+r)%12]*t.v[i];d/=Math.hypot(...c)||1;if(r===bass)d+=.07;const b=base();if(b!==null){const ok=(DIA[(r-b+12)%12]||[]).includes(t.n);d+=ok?.05:-.03}return d}
function acf(buf,sr){const n=2048;let e=0;for(let i=0;i<n;i++)e+=buf[i]*buf[i];if(Math.sqrt(e/n)<.01)return -1;const lo=Math.floor(sr/1000),hi=Math.floor(sr/70),r=new Float32Array(hi+2);let mx=0;for(let l=lo;l<=hi;l++){let s=0;for(let i=0;i<n;i++)s+=buf[i]*buf[i+l];r[l]=s/e;if(r[l]>mx)mx=r[l]}if(mx<.5)return -1;for(let l=lo+1;l<hi;l++)if(r[l]>.9*mx&&r[l]>=r[l-1]&&r[l]>=r[l+1])return sr/l;return -1}

$('#st').onclick=async()=>{if(run){run=false;stream.getTracks().forEach(t=>t.stop());wl&&wl.release();$('#st').textContent='Start';return}
 ctx=ctx||new (window.AudioContext||window.webkitAudioContext)();await ctx.resume();
 try{stream=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:false,noiseSuppression:false,autoGainControl:false}})}catch(e){$('#msg').textContent='Microphone blocked. Allow it in browser settings.';return}
 try{wl=await navigator.wakeLock.request('screen')}catch(e){}
 an=ctx.createAnalyser();an.fftSize=16384;an.smoothingTimeConstant=0;ctx.createMediaStreamSource(stream).connect(an);
 fb=new Float32Array(an.frequencyBinCount);tb=new Float32Array(an.fftSize);sus=new Float32Array(an.frequencyBinCount);run=true;$('#st').textContent='Stop';$('#msg').textContent='Listening…';loop()};
$('#sk').innerHTML+=NN.map((n,i)=>`<option value="${i}:0">${n} major</option><option value="${i}:1">${n} minor</option>`).join('');
$('#sk').onchange=e=>{if(!e.target.value)return;const[k,m]=e.target.value.split(':').map(Number);key={k,m,gap:1,early:false};locked=true;$('#lk').classList.add('on');showKey(k,m);$('#kc').textContent='Set by you'+(m?' · 1 = '+NN[base()]:'');draw()};
$('#lk').onclick=()=>{locked=!locked;$('#lk').classList.toggle('on',locked)};
$('#rs').onclick=()=>{stopPA();L=Array(12).fill(0);bh=Array(12).fill(0);rKey=null;mSc=0;minorF=false;loud=0;key=null;locked=false;$('#lk').classList.remove('on');cur=null;prog=[];$('#root').textContent='–';$('#qual').textContent='Listening for the key';seqA=[];lps=null;$('#kc').textContent='';$('#num').textContent='–';$('#nm').textContent='';draw()};

function loop(){if(!run)return;requestAnimationFrame(loop);if(performance.now()<mute||paused)return;
 an.getFloatFrequencyData(fb);an.getFloatTimeDomainData(tb);
 const sr=ctx.sampleRate,hz=sr/an.fftSize,lo=Math.ceil(65/hz),hi=Math.floor(1800/hz),bh=Math.floor(220/hz);
 const c=Array(12).fill(0),bc=Array(12).fill(0);let pk=-200,tot=0,bt=0;
 for(let i=lo;i<=hi;i++){const db=fb[i];if(db>pk)pk=db;const m=db<-90?0:Math.sqrt(Math.pow(10,db/20));
  sus[i]=sus[i]*.9+m*.1;const h=Math.min(m,2.5*sus[i]); // keep sustained notes, drop drum hits
  const mi=69+12*Math.log2(i*hz/440),r=Math.round(mi);if(Math.abs(mi-r)>.35||h<=0)continue;const p=((r%12)+12)%12;c[p]+=h;tot+=h;if(i<=bh){bc[p]+=h;bt+=h}}
 if(pk<-65||tot<=0){stab=0;cand='';return}
 for(let k=0;k<12;k++){c[k]/=tot;L[k]=L[k]*.995+c[k]}loud++;if(cur)cur.n=(cur.n||0)+1;for(let k=0;k<12;k++)bh[k]*=.999;
 let bass=-1;if(bt>0){const mx=Math.max(...bc);if(mx/bt>.35)bass=bc.indexOf(mx)}if(bass>=0)bh[bass]+=1;$('#bs').textContent=bass>=0?NN[bass]:'–';
 const f=acf(tb,sr);if(f>0){const mi=69+12*Math.log2(f/440),n=Math.round(mi),ct=(mi-n)*100;$('#nt').textContent=NN[((n%12)+12)%12]+(Math.floor(n/12)-1);$('#cn').textContent=(ct>=0?'+':'')+ct.toFixed(0)+'¢'}
 if(!locked&&loud>10&&loud%6==0){setKey();draw()}
 let best=null,bs=0;for(let r=0;r<12;r++)TY.forEach(t=>{const s=score(c,r,t,bass);if(s>bs){bs=s;best={r,t,s}}});
 if(!best||bs<.7){stab=0;cand='';return}
 const id=best.r+':'+best.t.n;$('#cf').style.width=Math.min(100,Math.max(0,(bs-.7)/.3*100))+'%';
 if(cur&&id===cur.id){stab=0;cand='';return}
 if(id===cand)stab++;else{cand=id;stab=0}
 const curS=cur?score(c,cur.r,TY.find(t=>t.n==cur.t),bass):0;
 if(stab>=10&&bs>curS+.04){cur={id,r:best.r,t:best.t.n,at:performance.now()};prog.push(cur);if(prog.length>24)prog.shift();stab=0;if(!seqA.length||sg(seqA[seqA.length-1])!=sg(cur))seqA.push(cur);if(seqA.length>200)seqA.shift();const dl=detect();if(dl){if(!(lps&&isRot(lps,dl)))lps=dl;$('#msg').textContent='Loop captured'}if(!locked)setKey();draw();paHear(cur);if(performance.now()>hold)showChord(cur,'Hearing ')}}
const lab=p=>base()===null?'?':LAB[(p.r-base()+12)%12]+p.t;
function showKey(k,m){$('#root').textContent=NN[k];$('#qual').textContent=m?'minor · relative '+NN[(k+3)%12]+' major':'major · relative '+NN[(k+9)%12]+' minor'}
const dd=a=>a.filter((p,i)=>i==0||p.id!==a[i-1].id);
let curList=[],hold=0;
function draw(){const l=prog[prog.length-1],A=lps||dd(seqA).slice(-8);curList=A;$('#num').textContent=l?lab(l):'–';$('#nm').textContent=l?NN[l.r]+l.t:'';
 $('#lp').textContent=lps?'Loop captured':'Listening for the loop…';$('#nums').textContent=A.length?A.map(lab).join('  '):'–';
 $('#pg').innerHTML=A.map((p,i)=>`<button class="chip${l&&p.id==l.id?' cur':''}" data-i="${i}"><b>${lab(p)}</b><span>${NN[p.r]+p.t}</span></button>`).join('')}
const mf=m=>440*2**((m-69)/12);
function tone(f,t0,d,v){const o=ctx.createOscillator(),g=ctx.createGain();o.type='triangle';o.frequency.value=f;g.gain.setValueAtTime(0,t0);g.gain.linearRampToValueAtTime(v,t0+.03);g.gain.exponentialRampToValueAtTime(.001,t0+d);o.connect(g);g.connect(outG||ctx.destination);o.start(t0);o.stop(t0+d+.05)}
async function ready(){ctx=ctx||new (window.AudioContext||window.webkitAudioContext)();await ctx.resume();return ctx.currentTime+.05}
$('#pr').onclick=async()=>{if(!key)return;const t=await ready();tone(mf(48+key.k),t,1.8,.25);tone(mf(36+key.k),t,1.8,.25);mute=performance.now()+2300};
const WS=[0,2,4,5,7,9,11,12],SOL=['Do','Re','Mi','Fa','Sol','La','Ti','Do'],BS=[[1,1],[3,2],[6,4],[8,5],[10,6]];
function build(el,base){el.innerHTML=WS.map((m,i)=>`<button class="wk" data-pc="${m%12}" data-m="${base+m}" aria-label="${NN[m%12]}">${SOL[i]}<small>${NN[m%12]}</small></button>`).join('')+BS.map(([m,wi])=>`<button class="bk" data-pc="${m}" data-m="${base+m}" aria-label="${NN[m]}" style="left:calc(10px + ${wi}*(100% - 20px)/8)"></button>`).join('')}
let rhPrev=66;
function voice(c,keep){const iv=TY.find(x=>x.n==c.t).s,p=[c.r,c.r+iv[1],c.r+iv[2]];let best=null,bd=1e9;
 for(let inv=0;inv<3;inv++){const q=p.slice(inv).concat(p.slice(0,inv).map(x=>x+12));for(const o of[48,60,72]){const n=q.map(x=>o+x),cen=(n[0]+n[1]+n[2])/3;if(n[0]<55||n[2]>79)continue;const d=Math.abs(cen-rhPrev);if(d<bd){bd=d;best=n}}}
 if(!keep)rhPrev=(best[0]+best[1]+best[2])/3;return{rh:best,lh:[36+c.r,43+c.r]}}
function mark(sel,ms,cls){document.querySelectorAll(sel+' button').forEach(b=>b.classList.remove(cls));ms.forEach(m=>document.querySelectorAll(`${sel} [data-pc="${m%12}"]`).forEach(b=>b.classList.add(cls)))}
function showChord(c,tag,v){if(!c){mark('#pi',[],'rh');mark('#pl',[],'lh');$('#pn').textContent='Tap a chord above or press the keys';return}v=v||voice(c,true);mark('#pi',v.rh,'rh');mark('#pl',v.lh,'lh');$('#pn').textContent=(tag||'')+NN[c.r]+c.t+'  ·  right hand '+v.rh.map(m=>NN[m%12]).join(' ')+'  ·  left hand '+NN[c.r]+' '+NN[(c.r+7)%12]}
const sound=(c,t0,d)=>{const v=voice(c);v.rh.forEach(m=>tone(mf(m),t0,d,.11));v.lh.forEach(m=>tone(mf(m),t0,d,.22));return v};
let pa=null;const LAT=250;
function paAt(i,late){if(!pa)return;const L=lps;if(!L)return;if(pa.L!==L){pa.L=L;pa.dur=durOf(L)}i%=L.length;const c=L[i],d=pa.dur[i];pa.pos=i;
 showChord(c,'Playing along · ',sound(c,ctx.currentTime+.02,d/1000*1.05));document.querySelectorAll('#pg .chip').forEach((b,k)=>b.classList.toggle('cur',k==i));
 clearTimeout(pa.tm);pa.tm=setTimeout(()=>paAt(i+1,false),Math.max(250,late?d-LAT:d))}
function paHear(c){if(!pa)return;if(!lps){showChord(c,'Playing along · ',sound(c,ctx.currentTime+.02,2.4));return}
 if(pa.L!==lps){pa.L=lps;pa.dur=durOf(lps);pa.pos=0}const L=lps,n=L.length,want=(pa.pos+1)%n;let k=-1;
 if(sg(L[pa.pos])==sg(c))k=pa.pos;else if(sg(L[want])==sg(c))k=want;else for(let j=0;j<n;j++)if(sg(L[j])==sg(c)){k=j;break}
 if(k<0)return;if(k===pa.pos){clearTimeout(pa.tm);pa.tm=setTimeout(()=>paAt(k+1,false),Math.max(250,pa.dur[k]-LAT))}else paAt(k,true)}
function stopPA(){if(!pa)return;clearTimeout(pa.tm);pa=null;hold=0;$('#pa').textContent='Play along';$('#pa').classList.remove('on');showChord(null)}
$('#pa').onclick=async()=>{if(pa){stopPA();return}if(!run){$('#msg').textContent='Press Start first, then Play along';return}await ready();pa={pos:0,L:lps,dur:lps?durOf(lps):[]};$('#pa').textContent='Stop playing along';$('#pa').classList.add('on');hold=Infinity;
 if(lps){const k=cur?lps.findIndex(p=>sg(p)==sg(cur)):-1;paAt(k<0?0:k,true)}else $('#msg').textContent='Learning the song… I join as soon as I hear a chord'};
$('#pg').onclick=async e=>{const b=e.target.closest('.chip');if(!b)return;const c=curList[+b.dataset.i];if(!c)return;const t=await ready();showChord(c,'Chord ',sound(c,t,1.4));hold=performance.now()+2500;mute=performance.now()+1600};
function durOf(a){const k=a.dur?a.dur.slice():a.map((c,i)=>i<a.length-1&&c.at&&a[i+1].at?a[i+1].at-c.at:null),ok=k.filter(x=>x>0),avg=ok.length?ok.reduce((x,y)=>x+y)/ok.length:1800;return k.map(x=>Math.min(8000,Math.max(300,x>0?x:avg)))}
function stopPlay(){if(!playing)return;clearTimeout(playing.tm);if(outG){outG.gain.value=0;try{outG.disconnect()}catch(e){}outG=null}playing=null;paused=false;mute=0;hold=0;$('#pp').textContent='Play progression';$('#msg').textContent='Listening…';showChord(null);draw()}
$('#pp').onclick=async()=>{if(playing){stopPlay();return}const a=lps||dd(seqA).slice(-8);if(!a.length)return;const dur=durOf(a),t=await ready();
 locked=true;$('#lk').classList.add('on');paused=true;hold=Infinity;outG=ctx.createGain();outG.connect(ctx.destination);playing={};$('#pp').textContent='Stop';$('#msg').textContent="Playing at the tempo you played it";
 let i=0;const step=()=>{if(i>=a.length){stopPlay();return}const c=a[i];showChord(c,'Playing ',sound(c,ctx.currentTime+.02,dur[i]/1000*1.05));document.querySelectorAll('#pg .chip').forEach((b,k)=>b.classList.toggle('cur',k==i));playing.tm=setTimeout(step,dur[i]);i++};step()};
[$('#pi'),$('#pl')].forEach(el=>el.onpointerdown=async e=>{const b=e.target.closest('button');if(!b)return;const t=await ready();tone(mf(+b.dataset.m),t,1.6,.22);b.classList.add('hit');setTimeout(()=>b.classList.remove('hit'),180)});
build($('#pl'),48);build($('#pi'),60);
draw();
</script></main></body></html>
